<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salion Games | Balls Arena</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- GLOBAL STYLES (White Theme) --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff; /* White background */
            color: #333333; /* Dark text for contrast */
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Center content vertically */
            padding: 40px 20px;
        }

        /* --- CONTAINER --- */
        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        /* --- HEADER / PROFILE SECTION --- */
        .profile-section {
            margin-bottom: 30px;
        }

        /* Logo styling (Top position) */
        .game-icon {
            width: 120px;
            height: 120px;
            border-radius: 28px; /* Smooth rounded corners */
            object-fit: cover;
            margin: 0 auto 20px; /* Centered with margin bottom */
            box-shadow: 0 8px 20px rgba(0,0,0,0.15); /* Soft shadow */
            display: block;
        }

        /* Brand Name styling */
        .brand-name {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 5px;
            display: block;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #000;
        }

        .bio {
            font-size: 1rem;
            color: #555;
            margin-bottom: 30px;
            padding: 0 10px;
        }

        /* --- LINKS SECTION --- */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        /* Link Buttons (Dark on White theme for contrast) */
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #111; /* Almost black buttons */
            color: #fff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 50px;
            transition: all 0.3s ease;
            font-weight: 600;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .link-btn:hover {
            background-color: #333;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        .link-btn i {
            font-size: 1.3rem;
            position: absolute;
            left: 30px;
        }

        /* --- STORE BUTTONS --- */
        .store-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .store-img {
            height: 50px;
            transition: transform 0.2s, opacity 0.2s;
        }
        
        .store-img:hover {
            opacity: 0.85;
            transform: scale(1.02);
        }

        /* Social specific colors on hover (Optional) */
        .youtube:hover { background-color: #ff0000; color: white; }
        .instagram:hover { background-color: #E1306C; color: white; }
        .tiktok:hover { background-color: #000000; color: #00f2ea; } /* TikTok effect */

        /* --- FOOTER --- */
        footer {
            margin-top: 60px;
            font-size: 0.85rem;
            color: #666;
            border-top: 1px solid #eee;
            padding-top: 30px;
        }

        .footer-links {
            margin-bottom: 15px;
        }

        .footer-links a {
            color: #555;
            text-decoration: none;
            margin: 0 8px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .footer-links a:hover {
            color: #000;
            text-decoration: underline;
        }

        .email-link {
            color: #888;
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <header class="profile-section">
            <img src="img/balls-arena.png" alt="Balls Arena Icon" class="game-icon">
            
            <span class="brand-name">Salion Games</span>
            
            <h1>Balls Arena</h1>
            <p class="bio">
                Ready for some epic ball battles? ⚔️
            </p>
        </header>

        <div class="store-buttons">
            <a href="https://apps.apple.com/us/app/balls-arena-battle/id6755978712" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="Download on the App Store" class="store-img">
            </a>
            <a href="https://play.google.com/store/apps/details?id=com.salion.ballsarena" target="_blank">
                <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Get it on Google Play" class="store-img">
            </a>
        </div>

        <div class="links-container">
            <a href="https://youtube.com/@ballsarenaofficial" target="_blank" class="link-btn youtube">
                <i class="fa-brands fa-youtube"></i>
                YouTube
            </a>

            <a href="https://www.instagram.com/ballsarenaofficial" target="_blank" class="link-btn instagram">
                <i class="fa-brands fa-instagram"></i>
                Instagram
            </a>

            <a href="https://www.tiktok.com/@ballsarenaofficial" target="_blank" class="link-btn tiktok">
                <i class="fa-brands fa-tiktok"></i>
                TikTok
            </a>
        </div>

        <footer>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="privacy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Use</a>
                <a href="support.html">Support</a>
            </div>
            
            <a href="mailto:support@salion.games" class="email-link">
                support@salion.games
            </a>
            <p>&copy; 2026 Salion. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>
